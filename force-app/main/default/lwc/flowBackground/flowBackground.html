<template>
  <svg class={svgClass} style={svgStyle} aria-hidden="true">
    <pattern
      id={patternId}
      x={pattern.x}
      y={pattern.y}
      width={pattern.width}
      height={pattern.height}
      patternUnits="userSpaceOnUse"
      patternTransform={pattern.transform}
    >
      <circle
        lwc:if={isDots}
        class={patternShapeClass}
        cx={pattern.radius}
        cy={pattern.radius}
        r={pattern.radius}
      ></circle>
      <path lwc:else class={patternShapeClass} stroke-width={pattern.lineWidth} d={pattern.d}></path>
    </pattern>
    <!-- `fill` is written in renderedCallback from the rendered pattern id; see the JS. -->
    <rect x="0" y="0" width="100%" height="100%"></rect>
  </svg>
</template>
